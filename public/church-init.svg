<!-- gcc-favicon-white.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GCC logo">
  <title>GCC</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ring { fill: none; stroke: #1e40af; stroke-width: 3; opacity: .95; }
      .txt { fill: #1e40af; font: 700 28px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; }
    </style>
  </defs>
  <circle class="bg" cx="32" cy="32" r="30"/>
  <circle class="ring" cx="32" cy="32" r="28.5"/>
  <text class="txt" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle">GCC</text>
</svg>
