<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Current Location</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-purple-50 to-blue-100 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full text-center border-t-4 border-blue-500"
    >
      <h1 class="text-3xl font-bold text-gray-800 mb-4">Find My Location</h1>
      <p class="text-gray-600 mb-6">
        Click the button below to get your current latitude and longitude.
      </p>

      <button
        id="getLocationBtn"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md"
      >
        Get My Location
      </button>

      <div
        id="locationDisplay"
        class="mt-8 p-4 bg-blue-50 rounded-lg text-left hidden"
      >
        <p class="text-gray-700 font-medium">
          Latitude:
          <span id="latitude" class="font-normal text-blue-800"></span>
        </p>
        <p class="text-gray-700 font-medium">
          Longitude:
          <span id="longitude" class="font-normal text-blue-800"></span>
        </p>
      </div>

      <div id="messageBox" class="mt-8 p-4 rounded-lg hidden" role="alert">
        <p id="messageText" class="font-medium"></p>
      </div>
    </div>

    <script>
      // Get references to HTML elements
      const getLocationBtn = document.getElementById("getLocationBtn");
      const locationDisplay = document.getElementById("locationDisplay");
      const latitudeSpan = document.getElementById("latitude");
      const longitudeSpan = document.getElementById("longitude");
      const messageBox = document.getElementById("messageBox");
      const messageText = document.getElementById("messageText");

      /**
       * Displays a message to the user in a styled message box.
       * @param {string} message - The message to display.
       * @param {string} type - The type of message ('success', 'error', 'info').
       */
      function showMessage(message, type) {
        messageText.textContent = message;
        messageBox.classList.remove(
          "hidden",
          "bg-red-100",
          "text-red-800",
          "bg-green-100",
          "text-green-800",
          "bg-yellow-100",
          "text-yellow-800"
        );
        locationDisplay.classList.add("hidden"); // Hide location display when showing a message

        if (type === "error") {
          messageBox.classList.add("bg-red-100", "text-red-800");
        } else if (type === "success") {
          messageBox.classList.add("bg-green-100", "text-green-800");
        } else {
          // 'info' or default
          messageBox.classList.add("bg-yellow-100", "text-yellow-800");
        }
        messageBox.classList.remove("hidden"); // Ensure message box is visible
      }

      /**
       * Hides the message box.
       */
      function hideMessage() {
        messageBox.classList.add("hidden");
      }

      /**
       * Callback function for successful geolocation.
       * @param {Position} position - The geolocation position object.
       */
      function successCallback(position) {
        hideMessage(); // Hide any previous messages
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        latitudeSpan.textContent = latitude.toFixed(6); // Format to 6 decimal places
        longitudeSpan.textContent = longitude.toFixed(6); // Format to 6 decimal places
        locationDisplay.classList.remove("hidden"); // Show the location display
      }

      /**
       * Callback function for geolocation errors.
       * @param {GeolocationPositionError} error - The geolocation error object.
       */
      function errorCallback(error) {
        locationDisplay.classList.add("hidden"); // Hide location display on error
        switch (error.code) {
          case error.PERMISSION_DENIED:
            showMessage(
              "You denied the request for Geolocation. Please allow location access to use this feature.",
              "error"
            );
            break;
          case error.POSITION_UNAVAILABLE:
            showMessage("Location information is unavailable.", "error");
            break;
          case error.TIMEOUT:
            showMessage("The request to get user location timed out.", "error");
            break;
          case error.UNKNOWN_ERROR:
            showMessage("An unknown error occurred.", "error");
            break;
          default:
            showMessage(
              "An unexpected error occurred while getting your location.",
              "error"
            );
            break;
        }
      }

      // Add event listener to the button
      getLocationBtn.addEventListener("click", () => {
        if (navigator.geolocation) {
          showMessage("Getting your location...", "info");
          // Options for geolocation request
          const options = {
            enableHighAccuracy: true, // Request high accuracy
            timeout: 5000, // 5 seconds timeout
            maximumAge: 0, // No cached location, get real-time
          };
          navigator.geolocation.getCurrentPosition(
            successCallback,
            errorCallback,
            options
          );
        } else {
          showMessage("Geolocation is not supported by your browser.", "error");
        }
      });
    </script>
  </body>
</html>
